name: Soroban Sentinel TTL Scan
description: Run a read-only Soroban storage TTL scan and publish a Markdown report.
branding:
  icon: shield
  color: purple

inputs:
  contract-id:
    description: Soroban contract address
    required: true
  network:
    description: testnet, mainnet, futurenet, or local
    required: false
    default: testnet
  rpc-url:
    description: Optional custom RPC endpoint
    required: false
  keys:
    description: Newline-separated persistent key symbols
    required: false
  threshold:
    description: Warning TTL threshold in ledgers
    required: false
    default: "120960"
  critical-threshold:
    description: Critical TTL threshold in ledgers
    required: false
  version:
    description: Release tag or latest
    required: false
    default: latest
  fail-on:
    description: warn, critical, or never
    required: false
    default: warn

outputs:
  status:
    description: Sentinel risk status
    value: ${{ steps.scan.outputs.status }}
  exit-code:
    description: Sentinel process exit code
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Download and verify Sentinel binary
      shell: bash
      env:
        ACTION_VERSION: ${{ inputs.version }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        if [[ "$ACTION_VERSION" == "latest" ]]; then
          tag=$(curl -fsSL https://api.github.com/repos/ekwe7/soroban-sentinel/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
        else
          tag="$ACTION_VERSION"
        fi
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) asset="sentinel-linux-x86_64.tar.gz" ;;
          Linux-ARM64) asset="sentinel-linux-aarch64.tar.gz" ;;
          macOS-X64) asset="sentinel-macos-x86_64.tar.gz" ;;
          macOS-ARM64) asset="sentinel-macos-aarch64.tar.gz" ;;
          *) echo "Unsupported runner: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        base="https://github.com/ekwe7/soroban-sentinel/releases/download/$tag"
        curl -fsSLo "/tmp/$asset" "$base/$asset"
        curl -fsSLo /tmp/SHA256SUMS "$base/SHA256SUMS"
        cd /tmp
        grep "  $asset$" SHA256SUMS | sha256sum -c -
        tar -xzf "$asset"
        install -m 0755 sentinel "$RUNNER_TEMP/sentinel"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Run TTL scan
      id: scan
      shell: bash
      env:
        CONTRACT_ID: ${{ inputs.contract-id }}
        NETWORK: ${{ inputs.network }}
        RPC_URL: ${{ inputs.rpc-url }}
        KEYS: ${{ inputs.keys }}
        THRESHOLD: ${{ inputs.threshold }}
        CRITICAL_THRESHOLD: ${{ inputs.critical-threshold }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set +e
        args=(scan "$CONTRACT_ID" --network "$NETWORK" --threshold "$THRESHOLD" --format json)
        [[ -n "$RPC_URL" ]] && args+=(--rpc-url "$RPC_URL")
        [[ -n "$CRITICAL_THRESHOLD" ]] && args+=(--critical-threshold "$CRITICAL_THRESHOLD")
        while IFS= read -r key; do
          [[ -n "$key" ]] && args+=(--key "$key")
        done <<< "$KEYS"
        output=$("$RUNNER_TEMP/sentinel" "${args[@]}" 2>"$RUNNER_TEMP/sentinel-error")
        code=$?
        if [[ $code -ne 0 && $code -ne 1 && $code -ne 2 ]]; then
          status=RPC_FAILURE
        else
          status=$(printf '%s' "$output" | python3 -c 'import json,sys; print(json.load(sys.stdin)["summary"])' 2>/dev/null || echo "UNKNOWN")
          if [[ $code -eq 2 ]]; then status=CRITICAL
          elif [[ $code -eq 1 ]]; then status=WARN
          else status=OK
          fi
        fi
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          markdown_args=(scan "$CONTRACT_ID" --network "$NETWORK" --threshold "$THRESHOLD" --format markdown)
          [[ -n "$RPC_URL" ]] && markdown_args+=(--rpc-url "$RPC_URL")
          [[ -n "$CRITICAL_THRESHOLD" ]] && markdown_args+=(--critical-threshold "$CRITICAL_THRESHOLD")
          while IFS= read -r key; do
            [[ -n "$key" ]] && markdown_args+=(--key "$key")
          done <<< "$KEYS"
          markdown=$("$RUNNER_TEMP/sentinel" "${markdown_args[@]}" 2>/dev/null || true)
          printf '%s\n' "$markdown" >> "$GITHUB_STEP_SUMMARY"
        fi

        case "$FAIL_ON" in
          never) exit 0 ;;
          warn) [[ $code -eq 0 || $code -eq 1 || $code -eq 2 ]] || exit "$code"; exit 0 ;;
          critical) [[ $code -eq 0 || $code -eq 1 ]] && exit 0; exit "$code" ;;
          *) echo "Invalid fail-on '$FAIL_ON'; use warn, critical, or never" >&2; exit 10 ;;
        esac
