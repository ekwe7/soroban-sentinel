name: Release Sentinel

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: sentinel-linux-x86_64
          - os: macos-latest
            name: sentinel-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build binary
        run: cargo build --release --locked -p sentinel-cli
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/sentinel dist/sentinel
          tar -czf "dist/${{ matrix.name }}.tar.gz" -C dist sentinel
          sha256sum "dist/${{ matrix.name }}.tar.gz" > "dist/${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
