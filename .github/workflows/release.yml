name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            format: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            format: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            format: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            format: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            format: zip
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64 Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact (tar.gz)
        if: matrix.format == 'tar.gz'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sentinel" dist/sentinel
          tar czf "sentinel-${{ matrix.target }}.tar.gz" -C dist sentinel

      - name: Package artifact (zip)
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/sentinel.exe" -DestinationPath "sentinel-${{ matrix.target }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-${{ matrix.target }}
          path: sentinel-${{ matrix.target }}.${{ matrix.format }}
          if-no-files-found: error

  release:
    name: Create GitHub Release and Attach Artifacts
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: sentinel-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Soroban Sentinel ${{ github.ref_name }}"
          files: |
            release-assets/SHA256SUMS
            release-assets/*.tar.gz
            release-assets/*.zip
          generate_release_notes: true
