name: Composite Action Self-Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Sentinel
        run: cargo build --release --locked -p sentinel-cli
      - name: Prepare checksum-verified fixture release
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) asset=sentinel-x86_64-unknown-linux-gnu.tar.gz ;;
            Linux-ARM64) asset=sentinel-aarch64-unknown-linux-gnu.tar.gz ;;
            macOS-X64) asset=sentinel-x86_64-apple-darwin.tar.gz ;;
            macOS-ARM64) asset=sentinel-aarch64-apple-darwin.tar.gz ;;
            *) echo "Unsupported self-test runner" >&2; exit 1 ;;
          esac
          release_dir="$RUNNER_TEMP/sentinel-fixtures/v0.1.0"
          mkdir -p "$release_dir"
          tar -czf "$release_dir/$asset" -C target/release sentinel
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$release_dir" && sha256sum "./$asset" > SHA256SUMS)
          else
            (cd "$release_dir" && shasum -a 256 "./$asset" > SHA256SUMS)
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 \
            --directory "$RUNNER_TEMP/sentinel-fixtures" \
            > "$RUNNER_TEMP/sentinel-fixture-server.log" 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/v0.1.0/SHA256SUMS >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/sentinel-fixture-server.log"
          exit 1
      - name: Exercise action
        uses: ./
        with:
          contract-id: CAGIVLP2G4GUJFAX4UHNQDZ7UZ6OFHT76ZZMMLKDEIHAHOBMISVNFCKU
          network: testnet
          fail-on: never
          release-base-url: http://127.0.0.1:8765/v0.1.0
