[package]
name = "sentinel-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Core domain logic, RPC client, and risk engine for Soroban Sentinel"

[features]
# Test-only entry points for the fuzz harnesses in `fuzz/`. Not enabled by default.
fuzzing = []

[dependencies]
tracing.workspace = true
stellar-xdr.workspace = true
stellar-strkey.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
sha2.workspace = true
wasmparser.workspace = true

[dev-dependencies]
wiremock.workspace = true
proptest = "1.4"
tempfile.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time", "test-util"] }
