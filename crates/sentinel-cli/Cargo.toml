[package]
name = "sentinel-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../README.md"
description = "Command-line interface for Soroban Sentinel"

[lib]
name = "sentinel_cli"
path = "src/lib.rs"

[[bin]]
name = "sentinel"
path = "src/main.rs"

[features]
# Interactive TUI dashboard. Disabled by default so the normal CLI binary
# stays free of terminal-UI dependencies.
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
sentinel-core.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
comfy-table.workspace = true
csv.workspace = true
thiserror.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest.workspace = true
stellar-xdr.workspace = true
stellar-strkey.workspace = true
toml = "0.8"
ratatui = { version = "0.26", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.27", optional = true }
tracing.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
wiremock.workspace = true
